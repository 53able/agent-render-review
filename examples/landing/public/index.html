<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — 夜のための照明</title>
<style>
  :root { --bg: #0b0d10; --ink: #eef1f4; --muted: #9aa3ad; --accent: #3ee6f0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, "Hiragino Sans", system-ui, sans-serif; }
  nav { display: flex; justify-content: space-between; padding: 20px 48px; color: var(--muted); }
  nav b { color: var(--ink); letter-spacing: .08em; }
  .hero { display: grid; grid-template-columns: 1fr 1.25fr; gap: 40px; align-items: center; padding: 40px 48px 64px; }
  h1 { font-size: 52px; line-height: 1.15; margin: 0 0 16px; }
  p { color: var(--muted); max-width: 30em; }
  .cta { display: inline-block; margin-top: 18px; padding: 12px 22px; border-radius: 8px; background: var(--accent); color: #04272a; font-weight: 700; text-decoration: none; }
  .visual { aspect-ratio: 16 / 9; width: 100%; border-radius: 14px; background: #15191e; object-fit: cover; display: block; }
</style>
</head>
<body>
  <nav><b>LUMEN</b><span>製品 · 物語 · 店舗</span></nav>
  <section class="hero">
    <div>
      <h1>夜を、<br>ひとつの光で。</h1>
      <p>部屋の明かりを落としたあとに残る、小さな発光体。Lumen は置いた場所だけを静かに照らします。</p>
      <a class="cta" href="#">予約する</a>
    </div>
    <img class="visual" src="/vork/hero.png" alt="暗い部屋で小さな光源が周囲を照らすキービジュアル">
  </section>
</body>
</html>
